<!-- THIS SIMPLE HTML FILE IS USED SO WE ALL HAVE A COMMON GROUND
      TEAM PYTHON: you need to match this html file  coming from the markdown syntax 
      TEAM JS: you need to make this mockup html file interactive
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Plugin Mockup</title>
</head>
<!-- data-question-index identifies each question block-->
<!-- data-correct indetifies which option is the right one -->
<!-- use style="display:none" to not display that question
(only 1 question should be visible at a time) 
    "selected" class will be applied when the user clicks on the button
    and will also modify the color so that the user can see that the button was pressed
-->

<body>
    <div class="quiz-container" markdown="1"> <!---syntax: ```quiz-->
      <div class="quiz-question-block" data-question-index="0"> <!--syntax: ### Q-->
        <p class="quiz-question">What is 2 + 2?</p> 
        <button class="quiz-answer" data-correct="false">3</button> <!--syntax:[]-->
        <button class="quiz-answer" data-correct="true">4</button> <!--syntax:[x]-->
        <button class="quiz-answer selected" data-correct="false">5</button><!--add this class
        only if this answer is clicked by the user-->
        <button class="quiz-nav-next">Next</button>
        <button class="quiz-nav-submit" style="display: none;">Submit</button>
      </div>
  
      <div class="quiz-question-block " data-question-index="1" style="display: none;">
        <p class="quiz-question">What is the capital of France?</p>
        <button class="quiz-answer" data-correct="true">Paris</button>
        <button class="quiz-answer" data-correct="false">London</button>
        <button class="quiz-answer" data-correct="false">Berlin</button>
        <button class="quiz-nav-next">Next</button>
        <button class="quiz-nav-submit" style="display: none;">Submit</button>
      </div>
      <div class="quiz-results">

      </div>
    </div> <!--syntax: ```-->
    </body> 
</html>
